<template x-if="historyResults.length&&grant.kind==='凭据使用'&&grant.reusable"><article class="document-card credential-card-entrance reusable-history"><div class="document-body"><div class="request-state"><span class="state-label" x-text="grant.state"></span><span>凭据使用 · 有效期内复用</span><code class="expires" x-text="grant.id"></code></div><h2 class="serif document-heading" x-text="grant.title"></h2><div class="identity"><span class="avatar">C</span><strong>Codex</strong><span>申请时的会话</span></div><div class="history-summary"><div><small>使用凭据</small><strong x-text="grant.snapshot?.credentialName"></strong></div><div><small>固定版本</small><strong x-text="'版本 '+grant.snapshot?.version"></strong></div><div><small>使用操作</small><strong><b x-text="reuseOperations.length"></b> 次</strong></div></div><div class="use-spec"><div><span>授权到期</span><strong x-text="grant.expires"></strong></div><div><span>允许方式</span><span x-text="{file_arg:'SSH · 临时文件参数',file_env:'AWS · 文件路径环境变量',env_value:'GitHub · Token环境变量'}[grant.snapshot?.delivery]"></span></div></div><p class="use-boundary">同一范围内可重复使用；每次操作独立记录，使用不会续期。</p><div class="section-heading"><h3>逐次使用记录</h3><small x-text="reuseOperations.length+' 次操作'"></small></div><p class="hint" x-show="!reuseOperations.length">尚无操作。批准不会自动启动程序。</p><template x-for="op in reuseOperations" :key="op.id"><button class="attachment-row reuse-operation" :aria-pressed="reuseOperation?.id===op.id" @click="selectedOperation=op.id"><span><strong x-text="op.id"></strong><span class="file-meta" x-text="op.time"></span></span><span x-text="{running:'运行中',exited:'已退出 · 0',start_failed:'启动失败 · 未运行',unknown:'结果未知'}[op.state]"></span></button></template><template x-if="reuseOperation"><section class="history-command"><h3>本次 CLI 启动计划</h3><div class="command-preview" x-text="reuseOperation.command"></div><div class="execution-facts"><div><span>计划摘要</span><code x-text="reuseOperation.planHash"></code></div><div><span>本次材料清理</span><strong x-text="reuseOperation.cleanup==='complete'?'已清理':reuseOperation.cleanup"></strong></div><div><span>授权状态</span><strong x-text="grant.state==='有效'?'仍可使用，期限不变':'已停止新使用'"></strong></div></div><p class="hint" x-show="reuseOperation.state==='start_failed'">只有本次操作失败。修正原因后用新的操作ID重做，无需重新审批。</p><p class="hint" x-show="reuseOperation.state==='unknown'">先查询原操作，不自动重放。确认需重做时再明确提交新的操作ID。</p></section></template></div><footer class="document-actions"><p>撤销阻止新使用；已经运行的进程继续，材料按各自进程组清理。</p><button class="secondary" x-show="grant.state==='有效'" @click="revokeReusable()">撤销使用授权</button></footer></article></template>

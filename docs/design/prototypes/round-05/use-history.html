<template x-if="historyResults.length&&grant.kind==='凭据使用'"><article class="document-card credential-card-entrance"><div class="document-body"><div class="request-state"><span class="state-label" :class="{'cleanup-alert':grant.usage==='cleanup-failed'}" x-text="grant.usage==='cleanup-failed'?'临时文件待清理':grant.state"></span><span>凭据使用 · 运行时注入</span><code class="expires" x-text="grant.id"></code></div><h2 class="serif document-heading" x-text="grant.title"></h2><div class="identity"><span class="avatar">C</span><strong>Codex</strong><span>申请时的会话</span></div><div class="history-summary"><div><small>使用凭据</small><strong x-text="historyCredential.credentialName"></strong></div><div><small>批准版本</small><strong x-text="'版本 '+historyCredential.version"></strong></div><div><small>运行次数</small><strong><b x-text="grant.reads"></b> / 1 次</strong></div></div><div class="use-spec"><div><span>注入方式</span><span style="color:var(--text)" x-text="{file_arg:'临时文件路径 → 命令参数',file_env:'临时文件路径 → 环境变量',env_value:'秘密值 → 环境变量'}[historyCredential.delivery]"></span></div><div><span x-text="historyCredential.delivery==='file_arg'?'文件引用':'环境变量'"></span><code x-text="historyCredential.binding"></code></div><div><span>申报目标</span><span style="color:var(--text)" x-text="historyCredential.target"></span></div></div>
 <div class="history-command"><small>由 CLI 启动的命令</small><div class="command-preview" x-text="historyCredential.command"></div></div><div class="grant-times"><span>授权时间 <b x-text="grant.time"></b></span><span x-text="grant.state==='有效'?'允许启动至 '+grant.expires:'授权结束于 '+grant.expires"></span></div><div class="approved-fields" x-show="historyCredential.fields.length"><strong>同时批准读取的连接字段</strong><span x-text="items.find(i=>i.id==='test').fields.filter(f=>historyCredential.fields.includes(f.id)).map(f=>f.name).join('、')"></span></div><div class="notice" x-show="grant.usage==='pending'"><svg><use href="#clock"/></svg><div><strong x-text="grant.state==='已撤销'?'已撤销，不能启动':'等待 CLI 启动任务'"></strong><p x-text="grant.state==='已撤销'?'这次没有注入凭据，也没有生成临时文件。':'仅生成了使用授权；尚未向进程注入凭据或生成临时文件。'"></p></div></div>
 <div x-show="grant.usage!=='pending'"><div class="usage-flow"><div><span class="number">01</span><strong>核对授权</strong><p>会话、凭据版本与次数匹配<br>允许启动本次任务</p></div><div><span class="number">02</span><strong>提供临时文件</strong><p>路径交给 ssh 进程<br>记录不包含私钥内容</p></div><div><span class="number">03</span><strong x-text="grant.usage==='cleanup-failed'?'清理未完成':'进程结束，已清理'"></strong><p x-text="grant.usage==='cleanup-failed'?'文件仍被其他进程占用':'已删除受管的临时文件'"></p></div></div><div class="cleanup-summary"><span>执行结果</span><strong>进程已结束</strong></div><div class="cleanup-summary"><span>文件清理</span><span x-text="grant.usage==='cleanup-failed'?'等待重试':'已完成'"></span></div><p class="use-boundary">这里只确认受管临时文件的清理。不能确认程序没有复制内容；也不会在此记录密钥原文。</p></div>
 </div><footer class="document-actions usage-footer"><p x-text="grant.usage==='pending'?'授权到期或被撤销后，CLI 将拒绝新的使用。':'记录保留使用对象、注入方式、运行与清理结果。'"></p><button class="secondary" x-show="grant.state==='有效'" @click="openCredentialDialog('stop')">撤销使用授权</button><button class="secondary" x-show="grant.usage==='cleanup-failed'" @click="openCredentialDialog('cleanup')">查看清理状态</button><button class="text-button" @click="openCredential(grant.snapshot?.credential||'ssh-deploy')">查看凭据 →</button></footer></article></template>

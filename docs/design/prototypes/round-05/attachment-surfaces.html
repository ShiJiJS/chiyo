<template x-if="flow==='attachment-template'"><div><p>模板只定义字段，不保存实际文件。每次套用后重新选择简历。</p><div class="file-template-field"><strong>姓名</strong><span>结构化字段</span></div><div class="file-template-field"><strong>求职说明</strong><span>受控说明</span></div><div class="file-template-field"><strong>简历</strong><span>文件 · 待选择</span></div><div class="modal-actions"><button class="secondary" @click="closeFlow()">返回</button><button class="primary" @click="useFileTemplate()">使用求职资料模板</button></div></div></template>
<template x-if="flow==='attachment-public'"><div><p>Agent 在批准前能看到以下字段说明；原文件名、大小、本机位置和内容不会公开。</p><template x-for="f in attachmentPublicFields" :key="f.name"><div class="attachment-row"><div><strong x-text="f.name"></strong><span class="file-meta" x-text="f.description"></span></div><span x-text="{file:'文件',structured:'结构化字段',textNote:'受控说明'}[f.kind]"></span></div></template></div></template>
<template x-if="flow==='attachment-history'"><div><p class="attachment-status" x-text="attachmentGrant?'普通信息读取 · '+attachmentGrant.state+' · 到期 '+attachmentGrant.expires:'尚未批准文件读取'"></p><div class="attachment-history-tabs"><button :class="{active:attachmentTab==='scope'}" @click="attachmentTab='scope'">批准范围</button><button :class="{active:attachmentTab==='deliveries'}" @click="attachmentTab='deliveries'">文件交付记录</button></div><template x-if="attachmentGrant"><div><div x-show="attachmentTab==='scope'"><template x-for="f in attachmentGrant.attachmentScope.flatMap(i=>i.fields)" :key="f.id"><div class="attachment-row"><strong x-text="f.name"></strong><span x-text="f.kind==='file'?'文件 · 版本 '+f.file.version:'文本字段'"></span></div></template><p class="field-help">未批准的字段不会提供；文件交付副本保留当次版本。</p></div><div x-show="attachmentTab==='deliveries'"><p x-show="!attachmentEvents.length">尚无文件交付。批准后不会自动领取。</p><template x-for="event in attachmentEvents" :key="event.id"><div class="attachment-row"><div><strong x-text="event.field+' · 版本 '+event.version"></strong><span class="file-meta" x-text="event.time"></span></div><span x-text="event.state"></span></div></template><p class="field-help">只记录交付事实，不保存正文或临时路径。</p></div><div class="modal-actions"><button class="secondary" x-show="attachmentGrant.state==='有效'" @click="revokeAttachment()">撤销授权</button><button class="primary" @click="page='history';historyId=attachmentGrant.id;closeFlow()">返回授权历史</button></div></div></template></div></template>
<template x-if="flow==='attachment-export'"><div><h3>另存文件</h3><p x-text="attachmentNotice"></p><p>原文件保持在信息库中。另存的副本由你自行保管，不随授权到期删除。</p><div class="modal-actions"><button class="primary" @click="closeFlow()">返回信息</button></div></div></template>
<template x-if="flow==='attachment-proposal'"><div><h3>核对姓名修改</h3><div class="attachment-row"><strong>姓名</strong><span>林予安 → 林予安（更新）</span></div><div class="attachment-row"><strong>简历 · 文件</strong><span>保留原文件与版本</span></div><p>该提案不改变简历文件。Agent 提交新文件的操作暂不支持；应由你在信息库选择文件。</p><div class="modal-actions"><button class="secondary" @click="closeFlow()">返回</button><button class="primary" @click="items.find(i=>i.id==='career').fields[0].value='林予安（更新）';closeFlow();showToast('已更新姓名，简历保持原样')">采用姓名修改</button></div></div></template>
<p class="attachment-status" role="status" x-show="attachmentNotice" x-text="attachmentNotice"></p>

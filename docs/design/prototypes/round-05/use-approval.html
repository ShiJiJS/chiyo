<template x-if="currentRequest.kind==='使用凭据'"><article class="approval-card credential-request credential-card-entrance"><div class="approval-document runtime-document">
 <div class="request-state"><span class="status" :class="{handled:currentRequest.state!=='待处理'}" x-text="currentRequest.state"></span><span>凭据使用申请</span><button class="text-button request-link" @click="showRequest()">查看申请明细 ↗</button></div>
 <h2 class="serif request-heading" x-text="useRequest.task"></h2><div class="identity"><span class="avatar">C</span><strong>Codex</strong><span>当前聊天</span><code x-text="currentRequest.id"></code></div><p class="runtime-purpose" x-text="useRequest.description"></p>
 <section class="runtime-section"><div class="runtime-heading"><span class="step-num">01</span><h3>使用哪个凭据</h3><button class="tip-toggle" aria-label="查看凭据引用说明" :aria-expanded="tip==='credential'" aria-controls="tip-credential" @click="toggleTip('credential')">?</button></div>
 <div class="inline-tip" id="tip-credential" x-show="tip==='credential'" x-transition.opacity><strong>申请只引用名称、标识与版本。</strong>凭据原文由本机服务保管，不放进申请。关联服务器信息不等于获得密钥使用权。</div>
 <label class="use-target"><input type="checkbox" x-model="allowCredential" :disabled="currentRequest.state!=='待处理'||useCredential.status!=='可用'" aria-label="允许使用此凭据"><div><strong x-text="useCredential.name"></strong><p x-text="(useCredential.form==='file'?'文件':'字符串')+' · '+useCredential.purpose+' · 版本 '+useCredential.version"></p></div><span class="tag" x-text="useCredential.status"></span></label></section>
 <section class="runtime-section"><div class="runtime-heading"><span class="step-num">02</span><h3>注入到哪里</h3><button class="tip-toggle" aria-label="查看注入方式说明" :aria-expanded="tip==='injection'" aria-controls="tip-injection" @click="toggleTip('injection')">?</button><span class="delivery-label" x-text="deliveryName"></span></div>
 <div class="inline-tip" id="tip-injection" x-show="tip==='injection'" x-transition.opacity><strong x-text="runtime.delivery==='env_value'?'环境变量装的是秘密值。':'交给程序的是路径，文件内容不进入命令。'"></strong><span x-text="runtime.delivery==='env_value'?'CLI 创建目标进程时设置变量，程序自己读取；不修改全局环境变量，也不生成文件。':runtime.delivery==='file_arg'?'CLI 将文件引用替换为一个完整路径参数，再启动程序。占位符不是操作系统或 shell 变量。':'CLI 生成临时文件，把路径写入目标进程认识的环境变量。命令里没有占位符也能工作。'"></span></div>
 <div class="injection-map"><div><small x-text="destinationLabel"></small><code x-text="destination"></code></div><span class="map-arrow">←</span><div><small>程序收到</small><strong x-text="receivedValue"></strong></div></div>
 <div class="file-reference" x-show="runtime.delivery==='file_arg'"><span>文件引用</span><code x-text="runtime.binding"></code><span>运行前由 CLI 替换</span></div></section>
 <section class="runtime-section"><div class="runtime-heading"><span class="step-num">03</span><h3>由 CLI 启动什么命令</h3><button class="tip-toggle" aria-label="查看 CLI 启动说明" :aria-expanded="tip==='launch'" aria-controls="tip-launch" @click="toggleTip('launch')">?</button></div>
 <div class="inline-tip" id="tip-launch" x-show="tip==='launch'" x-transition.opacity><strong>Agent 让信息授权 CLI 执行这份申请。</strong>批准不会自动运行。CLI 校验当前会话和使用授权后，准备凭据并启动下面的程序；Agent 直接执行含占位符的命令不会生效。程序、参数、工作目录或注入位置改变都需要重新申请。</div>
 <div class="command-preview" x-text="runtime.command"></div><div class="launch-meta"><span>执行机器 <b>本机</b></span><span>工作目录 <code>C:\Work\northstar</code></span></div><details class="executable-detail"><summary>程序位置与申报目标</summary><p><code x-text="runtime.executable"></code></p><p x-text="runtime.target"></p><small>申报目标由 Agent 提交，仅供判断，不构成网络隔离。</small></details>
 </section><details class="use-fields" x-show="useRequest.fields"><summary>另外申请读取连接字段 <span x-text="allowedFields.length"></span> / 3</summary><template x-for="f in items.find(i=>i.id==='test').fields"><label class="use-field"><input type="checkbox" :value="f.id" x-model="allowedFields" :disabled="currentRequest.state!=='待处理'"><span x-text="f.name"></span><code x-text="f.value"></code></label></template></details>
 </div><aside class="decision-panel"><div class="decision-inner"><small>本次决定</small><h2 class="serif">允许这次启动</h2><div class="big-count"><span x-text="allowCredential?'1':'0'"></span><small>项凭据</small></div><p class="selection-caption" x-text="useRequest.fields?'另提供 '+allowedFields.length+' 个连接字段':'不提供其他信息字段'"></p><div class="summary"><strong>批准 → Agent 调用 → CLI 启动</strong><p>仅一次，绑定当前会话。<br>按本页的凭据与启动内容执行。</p></div><label class="duration">允许启动的期限<select x-model="useMinutes" aria-label="凭据授权期限" :disabled="currentRequest.state!=='待处理'"><option value="15">15 分钟</option><option value="30">30 分钟</option></select></label><p class="injection-boundary">程序会接触原文。<br>运行时注入不构成强隔离。</p><div class="decision-actions" x-show="currentRequest.state==='待处理'"><button class="primary" :disabled="!canApproveUse" @click="openCredentialDialog('approve')">批准这次使用 <span>→</span></button><button class="reject" @click="openCredentialDialog('reject')">拒绝请求</button></div><div class="approved-use" x-show="currentRequest.state==='已批准'"><strong x-text="useGrant?.state==='已撤销'?'使用授权已撤销':'已批准，等待 Agent 调用'"></strong><span x-text="useGrant?.state==='已撤销'?'不能再启动这次任务。':'CLI 尚未启动程序或注入凭据。'"></span><button class="text-button" @click="viewUseHistory()">查看授权记录 →</button></div><div class="approved-use" x-show="currentRequest.state==='已拒绝'">申请已拒绝，未提供凭据。</div><p class="term-note">到期或撤销只阻止新启动，不能收回已读内容，也不会终止进程。</p><p class="term-note" x-show="useCredential.form==='file'">进程结束后清理临时文件。<br>清理失败会在历史中标记。</p></div></aside></article></template>

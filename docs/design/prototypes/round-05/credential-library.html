<main class="library-layout credential-library" x-show="page==='credentials'" x-cloak>
 <aside class="directory-panel"><div class="directory-head"><h1>信息库</h1><div class="library-mode"><button @click="page='library'">信息</button><button class="active">凭据</button></div></div><div class="directory-caption">凭据形式</div><button class="credential-side-button" :class="{active:credentialFilter==='all'}" @click="credentialFilter='all'"><svg><use href="#shield"/></svg>全部凭据<small x-text="credentials.length"></small></button><button class="credential-side-button" :class="{active:credentialFilter==='string'}" @click="credentialFilter='string'"><svg><use href="#key"/></svg>字符串<small x-text="credentials.filter(c=>c.form==='string').length"></small></button><button class="credential-side-button" :class="{active:credentialFilter==='file'}" @click="credentialFilter='file'"><svg><use href="#file"/></svg>文件<small x-text="credentials.filter(c=>c.form==='file').length"></small></button><div class="credential-side-note">凭据可以关联多条信息。<br>关联只建立引用，使用时仍需审批。</div></aside>
 <section class="item-list-panel"><header class="item-list-head"><div><h2>凭据</h2><p x-text="credentialResults.length+' 项 · 原文默认隐藏'"></p></div><button class="quiet-button" aria-label="添加凭据" @click="newCredential()"><svg><use href="#plus"/></svg>添加</button></header><label class="search" style="margin:17px 20px 5px"><svg><use href="#search"/></svg><input aria-label="搜索凭据" placeholder="搜索名称、用途" x-model="credentialSearch"></label><div class="item-list"><template x-for="c in credentialResults" :key="c.id"><button class="info-row" :class="{selected:credentialId===c.id}" :aria-pressed="credentialId===c.id" @click="credentialId=c.id;credentialTab='details'"><span class="info-icon"><svg><use :href="c.form==='file'?'#file':'#key'"/></svg></span><div><h3 x-text="c.name"></h3><p x-text="c.purpose"></p><div class="info-meta"><span x-text="c.form==='file'?'文件':'字符串'"></span><span x-text="c.status"></span></div></div><svg class="row-arrow"><use href="#chev"/></svg></button></template><div class="empty" x-show="!credentialResults.length"><h3>没有找到凭据</h3><p>试试其他名称或类型。</p><button @click="credentialSearch='';credentialFilter='all'">清除筛选</button></div></div><footer class="item-list-footer"><span>独立保管 · 按次授权</span></footer></section>
 <section class="info-detail-area"><article class="info-detail credential-detail" x-show="credentialResults.length"><div class="info-toolbar"><span>信息库 <svg><use href="#chev"/></svg> 凭据详情</span><span class="state-label" x-text="credential.status"></span></div><div class="info-document"><div class="path">凭据 / <span x-text="credential.form==='file'?'文件':'字符串'"></span></div><div class="info-title"><span class="large-icon"><svg><use :href="credential.form==='file'?'#file':'#key'"/></svg></span><div><h2 x-text="credential.name"></h2><p x-text="credential.note"></p></div></div><div class="item-properties"><div><small>用途</small><span x-text="credential.purpose"></span></div><div><small>当前版本</small><span x-text="'版本 '+credential.version"></span></div><div><small>到期时间</small><span x-text="credential.expires"></span></div></div>
 <div class="credential-secret"><svg><use href="#shield"/></svg><div><strong x-text="credential.form==='file'?credential.fileName:'•••• •••• •••• ••••'"></strong><small x-text="credential.form==='file'?credential.size+' · 文件内容不展示':'原文不返回到普通信息读取接口'"></small></div><span class="tag" x-text="credential.form==='file'?'加密文件':'加密内容'"></span></div>
 <div class="notice warn" x-show="credential.status!=='可用'"><svg><use href="#clock"/></svg><div><strong>此凭据当前不可使用</strong><p>过期或停用的凭据不能批准新的使用申请。</p></div></div>
 <div class="credential-facts"><div class="credential-fact"><span>可用交付方式</span><div><strong x-text="credential.form==='file'?'临时路径 → 参数或环境变量':'秘密值 → 环境变量'"></strong><p x-text="credential.form==='file'?'运行前生成临时文件，进程结束后尝试清理；不会将凭据放入项目目录。':'只为本次任务的进程环境提供值，不写入全局环境或命令参数。'"></p></div></div><div class="credential-fact"><span x-text="credential.form==='file'?'文件引用别名':'建议环境变量名'"></span><code x-text="credential.variable"></code></div><div class="credential-fact"><span>最近使用</span><span x-text="credential.lastUsed"></span></div></div>
 <section class="credential-links"><div class="section-heading"><h3>关联信息</h3><small x-text="linkedItems.length+' 条'"></small></div><template x-for="i in linkedItems" :key="i.id"><button class="credential-link" @click="openLinkedItem(i.id)"><svg><use href="#link"/></svg><div><strong x-text="i.name"></strong><small x-text="i.path"></small></div><svg><use href="#chev"/></svg></button></template><p x-show="!linkedItems.length" class="field-help">尚未关联信息。可在信息详情中添加关联。</p></section><div class="credential-notice"><svg><use href="#shield"/></svg><span>运行时注入会让目标程序接触原文。此方式减少对话中的暴露，不提供同用户进程间的强隔离。</span></div>
 </div><footer class="info-footer"><span><svg><use href="#shield"/></svg>关联不等于授权</span><button class="text-button" x-show="credentialRecords.length" @click="showCredentialRecords()">查看使用记录 →</button></footer></article><div class="credential-empty" x-show="!credentialResults.length">选择凭据后查看详情。</div></section>
</main>

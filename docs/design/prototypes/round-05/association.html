<section class="associated-credentials"><div class="section-heading"><h3>关联凭据</h3><button class="quiet-button" @click="editLinks()"><svg><use href="#link"/></svg>管理关联</button></div><p>凭据单独保管；批准读取这条信息不会同时提供凭据。</p><template x-for="c in itemCredentials" :key="c.id"><button class="credential-link" @click="openCredential(c.id)"><span class="info-icon"><svg><use :href="c.form==='file'?'#file':'#key'"/></svg></span><div><strong x-text="c.name"></strong><small x-text="c.purpose+' · '+(c.form==='file'?'临时文件路径':'环境变量')+' · '+c.status"></small></div><svg><use href="#chev"/></svg></button></template><p style="padding-top:13px" x-show="!itemCredentials.length">尚未关联凭据。</p></section>

<div class="modal-backdrop" x-show="fillDialog" x-cloak @click.self="closeFillDialog()" @keydown.escape.window="closeFillDialog()"><section class="modal credential-modal focused-fill-modal" role="dialog" aria-modal="true" aria-labelledby="fill-dialog-title" @keydown="trapFocus($event)"><div class="modal-head"><h2 id="fill-dialog-title" x-text="fillDialog==='reject'?'拒绝这次申请':'批准本机焦点填充'"></h2><button class="icon-button" aria-label="关闭填充确认" x-ref="fillClose" @click="closeFillDialog()">×</button></div>
 <template x-if="fillDialog==='approve'"><div><p>允许当前会话在 <strong x-text="useMinutes+' 分钟'"></strong>内，使用 <strong x-text="useCredential.name"></strong> 的当前版本，向 <strong x-text="useRequest.application?.name"></strong> 的前台密码框填充。</p><p class="use-boundary">批准本身不输入。Agent 随后重新点击密码框并调用 CLI；不会自动提交登录。网址仅为自述，不能保证目标网站来源。</p><p class="notice warn" role="alert" x-show="fillError" x-text="fillError"></p><div class="modal-actions"><button class="secondary" @click="closeFillDialog()">返回调整</button><button class="primary" :disabled="!canApproveFill" @click="approveFocusedFill()">确认批准授权</button></div></div></template>
 <template x-if="fillDialog==='reject'"><div><p>本次申请将被拒绝，不提供凭据，也不发送按键。</p><div class="modal-actions"><button class="secondary" @click="closeFillDialog()">返回</button><button class="primary" @click="rejectFocusedFill()">确认拒绝</button></div></div></template>
 </section></div>

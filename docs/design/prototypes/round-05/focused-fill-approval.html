<template x-if="currentRequest.kind==='使用凭据'&&isFocusedFill"><article class="approval-card credential-request credential-card-entrance focused-fill-card">
<div class="approval-document runtime-document">
 <div class="request-state"><span class="status" :class="{handled:currentRequest.state!=='待处理'}" x-text="currentRequest.state"></span><span>凭据使用 · 本机焦点填充</span></div>
 <h2 class="serif request-heading" x-text="useRequest.task"></h2><div class="identity"><span class="avatar">C</span><strong>Codex</strong><span>当前聊天</span><code x-text="currentRequest.id"></code></div><p class="runtime-purpose" x-text="useRequest.description"></p>
 <section class="runtime-section"><div class="runtime-heading"><span class="step-num">01</span><h3>使用哪个凭据</h3><button class="tip-toggle" aria-label="查看填充凭据说明" aria-controls="tip-fill-credential" :aria-expanded="tip==='fill-credential'" @click="toggleTip('fill-credential')">?</button></div>
 <p class="inline-tip" id="tip-fill-credential" x-show="tip==='fill-credential'" x-transition.opacity>申请只引用凭据身份和版本。密码由本机宿主取得并输入，CLI 不返回原文；文件凭据不用于密码框填充。</p>
 <label class="use-target"><input type="checkbox" x-model="allowCredential" :disabled="currentRequest.state!=='待处理'||useCredential.form!=='string'" aria-label="允许焦点填充此凭据"><div><strong x-text="useCredential.name"></strong><p x-text="useCredential.purpose+' · 版本 '+useCredential.version"></p></div><span class="tag" x-text="useCredential.form==='string'?'字符串':'不支持此类型'"></span></label></section>
 <section class="runtime-section"><div class="runtime-heading"><span class="step-num">02</span><h3>填充到哪里</h3><button class="tip-toggle" aria-label="查看填充目标核验说明" aria-controls="tip-fill-target" :aria-expanded="tip==='fill-target'" @click="toggleTip('fill-target')">?</button></div>
 <div class="use-spec"><div><span>允许的应用</span><strong x-text="useRequest.application.name"></strong></div><div><span>输入目标</span><span>该应用当前前台的密码框</span></div><div><span>申报页面</span><code x-text="useRequest.target"></code></div></div>
 <p class="inline-tip" id="tip-fill-target" x-show="tip==='fill-target'" x-transition.opacity>每次核验前台窗口、进程创建身份和密码控件。锁屏、目标变化或无法识别时拒绝。应用身份不等于网站来源；此处网址由 Agent 自述，未核验。</p>
 <details class="executable-detail"><summary>应用位置与固定摘要</summary><p><code x-text="useRequest.application.executable"></code></p><p><code x-text="'SHA-256 '+useRequest.application.sha256"></code></p><small>程序更新后摘要变化，需要重新申请。相同应用中的其他页面仍须谨慎确认。</small></details></section>
 <section class="runtime-section"><div class="runtime-heading"><span class="step-num">03</span><h3>批准后如何使用</h3><button class="tip-toggle" aria-label="查看焦点填充步骤" aria-controls="tip-fill-flow" :aria-expanded="tip==='fill-flow'" @click="toggleTip('fill-flow')">?</button></div>
 <ol class="fill-steps"><li><strong>Agent 点击密码框</strong><span>审批后重新点击目标，保持本机前台焦点。</span></li><li><strong>后台调用 CLI</strong><span>只提交本申请引用与独立操作 ID；本机宿主核验后输入。</span></li><li><strong>查看输入状态</strong><span>不自动提交登录；异常时查询原操作，不自动重填。</span></li></ol>
 <p class="inline-tip" id="tip-fill-flow" x-show="tip==='fill-flow'" x-transition.opacity>此方式没有待启动的业务命令，也不创建临时密钥文件。按键已提交不代表网站已接收完整内容或登录成功。保持密码遮挡；显示明文后的截图仍可能进入模型上下文。</p>
 </section>
</div><aside class="decision-panel"><div class="decision-inner"><small>本次决定</small><h2 class="serif">允许密码框填充</h2><div class="big-count"><span x-text="allowCredential?'1':'0'"></span><small>项凭据</small></div><p class="selection-caption">不提供密码原文或其他字段</p><div class="summary"><strong>批准 → 点击密码框 → CLI 填充</strong><p>固定凭据版本、应用和使用方式。<br>期限内可重复使用，每次独立记录。</p></div><label class="duration">使用授权期限<select x-model="useMinutes" aria-label="焦点填充授权期限" :disabled="currentRequest.state!=='待处理'"><option value="15">15 分钟</option><option value="30">30 分钟</option></select></label>
 <div class="decision-actions" x-show="currentRequest.state==='待处理'"><button class="primary" :disabled="!canApproveFill" @click="openFillDialog()">批准填充授权 <span>→</span></button><button class="reject" @click="openFillDialog('reject')">拒绝请求</button></div>
 <div class="approved-use" x-show="currentRequest.state==='已批准'"><strong x-text="useGrant?.state==='已撤销'?'使用授权已撤销':'已批准，等待 Agent 点击密码框'"></strong><span>批准不会发送按键。</span><button class="text-button" @click="viewUseHistory()">查看使用记录 →</button></div><div class="approved-use" x-show="currentRequest.state==='已拒绝'">已拒绝，未提供凭据。</div><p class="term-note">撤销或到期阻止后续输入，不能清除已经填入的内容。</p></div></aside>
</article></template>

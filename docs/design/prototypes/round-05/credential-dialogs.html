<div class="modal-backdrop" x-show="credentialDialog" x-cloak @click.self="closeCredentialDialog()" @keydown.escape.window="closeCredentialDialog()"><section class="modal credential-modal" role="dialog" aria-modal="true" aria-labelledby="credential-dialog-title" @keydown="trapFocus($event)"><div class="modal-head"><h2 class="serif" id="credential-dialog-title" x-text="{request:'申请明细',new:'添加凭据',link:'关联凭据',approve:'批准凭据使用',reject:'拒绝使用申请',stop:'撤销使用授权',cleanup:'临时文件清理状态'}[credentialDialog]"></h2><button x-ref="credentialClose" aria-label="关闭凭据对话框" @click="closeCredentialDialog()">×</button></div>
 <template x-if="credentialDialog==='new'"><div><div class="credential-form-options"><button :class="{active:credentialForm==='string'}" @click="credentialForm='string';credentialVariable='SERVICE_TOKEN'"><strong>字符串</strong><small>Token、密码等秘密文本</small></button><button :class="{active:credentialForm==='file'}" @click="credentialForm='file';credentialVariable='CREDENTIAL_FILE'"><strong>文件</strong><small>SSH 私钥、证书、Cookie 文件</small></button></div><label>凭据名称<input x-model="credentialName" placeholder="例如：测试服务器部署密钥" maxlength="60"></label><label x-show="credentialForm==='string'">凭据内容<input type="password" autocomplete="off" x-model="credentialInput" placeholder="输入 Token 或秘密值"></label><label x-show="credentialForm==='file'">凭据文件<input type="file" @change="credentialFileName=$event.target.files[0]?.name||''"></label><p class="field-help" x-text="credentialForm==='file'?'保存文件内容的独立副本。更改原文件不会自动更新凭据，也不会自动删除原文件。':'可申请命令注入或本机密码框填充，不通过普通读取接口提供原文。'"></p><label x-text="credentialForm==='file'?'文件引用别名':'建议环境变量名（可留空）'"></label><input aria-label="默认注入变量名" x-model="credentialVariable"><p class="field-help">文件别名使用字母、数字和下划线。密码框填充无需变量名；命令使用时，在申请中声明目标程序认识的参数或环境变量。</p><div class="modal-actions"><button class="secondary" @click="closeCredentialDialog()">取消</button><button class="primary" :disabled="!canSaveCredential" @click="saveCredential()">保存凭据</button></div></div></template>
 <template x-if="credentialDialog==='link'"><div><p>为「<span x-text="currentItem.name"></span>」选择可引用的凭据。关联后，使用仍需单独授权。</p><template x-for="c in credentials" :key="c.id"><label class="link-choice"><input type="checkbox" :value="c.id" x-model="linkedDraft" :disabled="c.status!=='可用'"><span><strong x-text="c.name"></strong><small x-text="c.purpose+' · '+(c.form==='file'?'文件':'字符串')"></small></span><span class="tag" x-text="c.status"></span></label></template><div class="modal-actions"><button class="secondary" @click="closeCredentialDialog()">取消</button><button class="primary" @click="saveLinks()">保存关联</button></div></div></template>
 <template x-if="credentialDialog==='approve'"><div><p>允许本次会话启动一次任务，使用「<span x-text="useCredential.name"></span>」版本 <span x-text="useCredential.version"></span>。</p><div class="credential-fact"><span>有效期</span><span x-text="useMinutes+' 分钟内允许启动'"></span></div><div class="credential-fact"><span>注入方式</span><div><strong x-text="deliveryName"></strong><br><code x-text="runtime.delivery==='file_arg'?runtime.binding+' → -i':runtime.binding"></code></div></div><div class="command-preview" x-text="runtime.command"></div><p class="field-help">由信息授权 CLI 启动。批准不会立即运行；程序、参数和注入位置按本次申请固定。</p><div class="notice"><svg><use href="#shield"/></svg><div><strong>程序可接触原文</strong><p>撤销只会阻止新的启动，不能收回已注入的内容，也不会终止已运行进程。</p></div></div><div class="modal-actions"><button class="secondary" @click="closeCredentialDialog()">返回核对</button><button class="primary" @click="approveUse()">确认批准</button></div></div></template>
 <template x-if="credentialDialog==='reject'"><div><p>本次申请不会获得凭据使用权限，也不会提供同时申请的连接字段。</p><div class="modal-actions"><button class="secondary" @click="closeCredentialDialog()">返回核对</button><button class="primary" @click="rejectUse()">确认拒绝</button></div></div></template>
 <template x-if="credentialDialog==='stop'"><div><p>撤销后不能再用本次授权启动任务。尚未注入的凭据不会被提供。</p><div class="modal-actions"><button class="secondary" @click="closeCredentialDialog()">取消</button><button class="primary" @click="stopCredentialUse()">确认撤销</button></div></div></template>
 <template x-if="credentialDialog==='cleanup'"><div><p>本次任务的临时文件尚未清理。记录中不展示凭据内容。</p><div class="credential-fact"><span>受管文件</span><code>run-021 / deploy_ed25519</code></div><div class="credential-fact"><span>当前状态</span><span>文件被占用，等待重试</span></div><div class="credential-fact"><span>处理方式</span><span>结束相关进程后重试；应用下次启动时也会检查残留。</span></div><div class="modal-actions"><button class="primary" @click="closeCredentialDialog()">知道了</button></div></div></template>
 <template x-if="credentialDialog==='request'"><div><p>Codex 提交的申请；用途与目标是自述内容。原文不随申请提交。</p><div class="request-brief"><span>使用凭据</span><strong x-text="useCredential.name+' · 版本 '+useCredential.version"></strong></div><div class="request-brief"><span>注入位置</span><div><strong x-text="deliveryName"></strong><br><code x-text="runtime.delivery==='file_arg'?runtime.binding+' → -i':runtime.binding"></code></div></div><div class="request-brief"><span>启动命令</span><code x-text="runtime.command"></code></div><div class="inline-tip"><strong>批准后，由 Agent 调用 CLI 启动。</strong>CLI 持有本次会话的临时授权凭证；请求编号只是定位信息，不能单独换取秘密。</div><details><summary>查看结构化申请与执行调用</summary><pre class="request-contract" x-text="requestPayload"></pre><p>批准后，在同一个 CLI 会话发送：</p><pre class="request-contract" x-text="JSON.stringify({command:'run-use',requestId:requestId})"></pre><p class="field-help">CLI 执行获批的启动内容，不接受在此处另传新命令。文件对象由 CLI 解析为路径，不交给 shell 展开。</p></details><div class="modal-actions"><button class="primary" @click="closeCredentialDialog()">返回审批</button></div></div></template>
</section></div>

<template x-if="historyResults.length&&grant.focusedFill"><article class="document-card credential-card-entrance focused-fill-history"><div class="document-body">
 <div class="request-state"><span class="state-label" x-text="grant.state"></span><span>凭据使用 · 本机焦点填充</span><code class="expires" x-text="grant.id"></code></div><h2 class="serif document-heading" x-text="grant.title"></h2><div class="identity"><span class="avatar">C</span><strong>Codex</strong><span>申请时的会话</span></div>
 <div class="history-summary"><div><small>使用凭据</small><strong x-text="grant.snapshot.credentialName"></strong></div><div><small>固定版本</small><strong x-text="'版本 '+grant.snapshot.version"></strong></div><div><small>使用操作</small><strong x-text="fillOperations.length+' 次'"></strong></div></div>
 <div class="use-spec"><div><span>允许的应用</span><strong x-text="grant.snapshot.application.name"></strong></div><div><span>输入目标</span><span>本机前台密码框</span></div><div><span>授权到期</span><strong x-text="grant.expires"></strong></div></div><p class="use-boundary">同一范围内可重复使用，操作不会续期。记录输入事实，不保存密码或输入框内容。</p>
 <div class="section-heading"><h3>逐次填充记录</h3><small x-text="fillOperations.length+' 次操作'"></small></div><p class="hint" x-show="!fillOperations.length">尚未填充。Agent 需先点击获批应用中的密码框，再后台调用 CLI。</p>
 <template x-for="op in fillVisibleOperations" :key="op.id"><button class="attachment-row reuse-operation" :aria-pressed="fillOperation?.id===op.id" @click="selectedFillOperation=op.id"><span><strong x-text="op.id"></strong><span class="file-meta" x-text="op.time"></span></span><span x-text="fillStateLabel(op.state)"></span></button></template>
 <div class="queue-pager" x-show="fillOperations.length>8"><span x-text="fillVisibleOperations.length+' / '+fillOperations.length+' 次'"></span><button class="text-button" aria-label="上一页填充记录" :disabled="fillCurrentPage===0" @click="changeFillPage(-1)">‹</button><span x-text="(fillCurrentPage+1)+' / '+fillPages"></span><button class="text-button" aria-label="下一页填充记录" :disabled="fillCurrentPage+1>=fillPages" @click="changeFillPage(1)">›</button></div>
 <template x-if="fillOperation"><section class="history-command"><div class="section-heading"><h3 x-text="fillStateLabel(fillOperation.state)"></h3><small x-text="fillOperation.id"></small></div><p class="fill-outcome" x-text="fillNextStep"></p><div class="execution-facts"><div><span>处理时间</span><strong x-text="fillOperation.time"></strong></div><div><span>本次应用</span><strong x-text="fillOperation.application"></strong></div><div><span>原因</span><span x-text="fillOperation.reason||'前台应用及密码控件核验后提交输入。'"></span></div></div><p class="use-boundary" x-show="['partial','unknown'].includes(fillOperation.state)">不要自动重填。此状态不能当作“未输入”，也不能当作登录成功。</p></section></template>
 <template x-if="fillOperation&&['partial','unknown'].includes(fillOperation.state)"><div class="use-boundary"><p x-show="fillOperation.attentionAcknowledgedAt">已由用户确认目标。原输入结果保留，未重填，也未延长授权。</p><button class="secondary" x-show="!fillOperation.attentionAcknowledgedAt" @click="openFillDialog('acknowledge')">我已检查并处理输入框</button></div></template>
 </div><footer class="document-actions"><p>撤销阻止后续填充，已填内容仍由目标应用持有。</p><button class="secondary" x-show="grant.state==='有效'" @click="revokeFocusedFill()">撤销填充授权</button></footer></article></template>

<!-- Included verbatim in index.html. Canonical interactive entry is index.html. -->
<div class="modal-backdrop flow-backdrop" x-show="flow" x-cloak @click.self="closeFlow()" @keydown.escape.window="flow&&closeFlow()">
 <section class="modal flow-modal" role="dialog" aria-modal="true" aria-labelledby="flow-title" @keydown="trapFocus($event)">
  <div class="modal-head"><h2 id="flow-title" class="serif" x-text="{editor:editor?.fresh?'新建信息':'编辑信息','proposal-editor':'调整提案内容',trash:'信息回收站',revision:'修改历史与恢复',taxonomy:'目录与标签',scope:'调整提供范围',backup:'备份与恢复','credential-manage':{rotate:'更换凭据版本',disable:'停用凭据',enable:'启用凭据',delete:'删除凭据',restore:'恢复凭据',metadata:'Agent 可见信息与有效期'}[credentialAction],migration:'将旧字段转为托管凭据',service:'应用运行状态','combined-result':'本次审批结果','request-terminal':'请求状态'}[flow]"></h2><button x-ref="flowClose" aria-label="关闭流程面板" @click="closeFlow()">×</button></div>
  <template x-if="['editor','proposal-editor'].includes(flow)&&editor"><div class="flow-panel"><div class="flow-scroll">
   <div class="flow-grid"><label>信息名称<input aria-label="信息名称" x-model="editor.name"></label><label>所在目录<input aria-label="信息目录" x-model="editor.path" list="flow-folders"><datalist id="flow-folders"><template x-for="node in tree"><option :value="node.path.replaceAll('/',' / ')"></option></template></datalist></label></div>
   <label>公开说明<textarea aria-label="公开说明" x-model="editor.publicDescription"></textarea></label><label>标签<input aria-label="信息标签" x-model="editor.tag"></label>
   <h3>信息字段</h3><p class="field-help">字段内容会按读取授权返回给 Agent。Token 和密钥请单独保存为凭据并建立关联。</p>
   <template x-for="(f,i) in editor.fields" :key="f.id"><section class="flow-field"><div class="flow-grid"><label>字段名称<input :aria-label="'字段名称 '+(i+1)" x-model="f.name"></label><label>字段内容<input :aria-label="'字段内容 '+(i+1)" x-model="f.value"></label></div><label>字段公开说明<input x-model="f.description"></label><button class="text-button" @click="editor.fields.splice(i,1)" x-show="editor.fields.length>1">移除字段</button></section></template>
   <button class="quiet-button" @click="addEditorField()">＋ 添加字段</button></div><div class="modal-actions"><button class="secondary" @click="closeFlow()">取消</button><button class="primary" @click="flow==='editor'?saveItem():saveProposalEdit()">保存<span x-text="flow==='editor'?'信息':'提案调整'"></span></button></div>
  </div></template>
  <template x-if="flow==='scope'"><div class="flow-panel"><div class="flow-scroll"><p>申请范围与最终提供范围分别保存。你可以取消申请字段，或补选其他信息的字段。</p><label>搜索信息<input aria-label="范围搜索" x-model="scopeSearch" placeholder="搜索名称或说明"></label><div class="flow-rows"><template x-for="item in scopeItems" :key="item.id"><section><h3 x-text="item.name"></h3><template x-for="f in item.fields" :key="f.id"><label><input type="checkbox" :value="f.id" x-model="selection"><span x-text="f.name"></span><small x-text="currentRequest.itemIds.includes(item.id)?'原申请':'用户补选'"></small></label></template></section></template></div></div><div class="modal-actions"><button class="primary" @click="closeFlow()">使用这 <span x-text="approvalCount"></span> 个字段</button></div></div></template>
  <template x-if="flow==='trash'"><div><p>保留 30 天。恢复信息不会恢复旧授权；关联凭据仍独立保存。</p><div class="flow-rows"><template x-for="item in trash" :key="item.id"><div><span><strong x-text="item.name"></strong><br><small x-text="item.path"></small></span><button class="secondary" @click="restoreItem(item.id)">恢复信息</button></div></template></div><p x-show="!trash.length" class="flow-result">回收站为空。信息详情中的「移入回收站」会将信息保留在这里。</p></div></template>
  <template x-if="flow==='revision'"><div><p>旧值只对用户可见。恢复建立一个新版本；被移除后恢复的字段使用新身份，旧授权不会重新生效。</p><div class="flow-rows"><template x-for="(r,i) in revisions"><div><span><strong x-text="r.name+' · 版本 '+(i+1)"></strong><br><span x-text="r.description"></span></span><button class="secondary" @click="restoreRevision(i)">恢复为新版本</button></div></template></div></div></template>
  <template x-if="flow==='taxonomy'"><div><p>目录可有父子层级，移动目录保留信息身份。标签用于跨目录筛选。</p><label>新目录名称<input x-model="dialogText" placeholder="工作/北辰项目/运维"></label><div class="flow-actions"><button class="secondary" @click="if(dialogText.trim()){tree.push({name:dialogText.split('/').at(-1),path:dialogText.trim(),depth:dialogText.split('/').length-1});dialogText=''}">添加目录</button></div><div class="flow-rows"><template x-for="node in tree" :key="node.path"><div><span x-text="node.path"></span><button class="text-button" @click="folder=node.path;page='library';pickFirstItem();closeFlow()">查看信息 →</button></div></template></div><label>常用标签<input placeholder="开发、自托管、常用" value="开发、自托管、常用"></label><p class="field-help">移除目录前需将信息移入其他目录；删除标签只解除标签关联。</p></div></template>
  <template x-if="flow==='backup'"><div>
   <p>使用独立恢复密钥加密备份。信息、托管凭据和保留期内旧版本入备份；临时授权、待处理请求和运行材料不入备份。</p>
   <template x-if="backupStage==='disabled'"><div><h3>首次启用备份</h3><p>创建并另存恢复密钥后才能导出。请与备份文件分开保存。</p><button class="secondary" @click="backupStage='key-created'">创建恢复密钥</button></div></template>
   <div x-show="backupStage==='key-created'"><h3>保存恢复密钥</h3><p>选择独立位置另存恢复密钥，完成保存后启用导出。</p><button class="secondary" @click="backupKeySaved=true;backupStage='key-saved'">另存恢复密钥</button></div>
   <div x-show="backupKeySaved"><div class="flow-result"><strong>恢复密钥已另存</strong><p>每次导出前检查目标位置。不要把恢复密钥交给 Agent。</p></div><button class="primary" @click="exportBackup()">导出加密备份</button></div>
   <h3>恢复到空的信息库</h3><p x-text="restoreEmpty?'当前目标库为空，可以检查备份。':'目标库非空（包括托管凭据），不能覆盖或合并恢复。'"></p><div class="flow-grid"><label>备份文件<input type="file" accept=".imbackup" @change="backupFileSelected=!!$event.target.files.length;restorePreview=false"></label><label>恢复密钥文件<input type="file" @change="backupRecoverySelected=!!$event.target.files.length;restorePreview=false"></label></div><button class="secondary" @click="inspectBackup()">检查备份与恢复密钥</button>
   <div x-show="restorePreview"><h3>恢复预览</h3><p>12 条信息、4 项凭据、版本记录与历史事实。历史授权不会生效；凭据到期按当前时间重新判断。</p><button class="primary" @click="restoreBackup()">确认恢复到空库</button></div><p class="flow-error" x-show="restoreError" x-text="restoreError"></p><p class="flow-result" role="status" x-text="backupResult"></p>
  </div></template>
  <template x-if="flow==='credential-manage'"><div>
   <p><strong x-text="credential.name"></strong> · 当前版本 <span x-text="credential.version"></span> · <span x-text="credential.status"></span></p>
   <div x-show="credentialAction==='rotate'"><label x-show="credential.form==='string'">新凭据内容<input type="password" autocomplete="off" x-model="newSecret"></label><label x-show="credential.form==='file'">新凭据文件<input type="file" @change="newSecret=$event.target.files[0]?.name||''"></label><p>新版本会使旧版待启动许可失效。旧秘密加密保留 30 天供用户恢复，不能申请使用。</p></div>
   <div x-show="credentialAction==='metadata'"><label><input type="checkbox" x-model="credentialPublic"> 允许 Agent 发现此凭据</label><div class="flow-facts"><div><span>公开引用</span><code x-text="credential.id+' · v'+credential.version"></code></div><div><span>公开名称与用途</span><strong x-text="credential.name+' · '+credential.purpose"></strong></div><div><span>公开形式与状态</span><span x-text="credential.form+' · '+credential.status"></span></div></div><p class="field-help">默认关闭；不披露原文、导入源路径和私有备注。关联某信息不自动公开。</p><label>到期时间<input aria-label="凭据到期时间" x-model="expiryDraft" placeholder="未设置"></label></div>
   <p x-show="credentialAction==='disable'">停用保留资料，使待启动许可失效。正在运行的程序不会停止。</p><p x-show="credentialAction==='delete'">移入凭据回收站 30 天，待启动许可立即失效。关联信息不会删除；离线备份中的副本仍可能保留。</p><p x-show="credentialAction==='restore'">恢复为停用状态并建立新版本；重新启用并重新申请后才可使用。旧许可不会恢复。</p><p x-show="credentialAction==='enable'">启用后可重新申请使用；已过期凭据仍需先修改有效期。</p>
   <div class="modal-actions"><button class="secondary" @click="closeFlow()">取消</button><button class="primary" @click="saveCredentialManagement()" x-text="{rotate:'保存新版本',disable:'停用凭据',enable:'启用凭据',delete:'移入凭据回收站',restore:'恢复为停用凭据',metadata:'保存可见性与有效期'}[credentialAction]"></button></div>
  </div></template>
  <template x-if="flow==='migration'"><div><p>只转换用户明确选中的普通字段。不会扫描或自动猜测秘密。</p><div class="flow-facts"><div><span>旧字段</span><strong>文档服务 / 访问令牌</strong></div><div><span>会受到影响</span><span>2 项读取授权、3 个历史版本</span></div><div><span>转换后</span><span>独立字符串凭据，默认不允许发现</span></div></div><p>确认后原普通读取路径关闭，旧字段授权永久失效；保留历史供用户查看，离线备份不会同步擦除。整个转换失败时整批回滚。</p><div class="modal-actions"><button class="secondary" @click="closeFlow()">取消</button><button class="primary" @click="flowError=injectFailure?'转换失败，原信息未改变。':'已建立托管凭据并关闭旧读取路径。旧授权不会恢复。'">确认转换所选字段</button></div></div></template>
  <template x-if="flow==='service'"><div><h3 x-text="{connected:'本机服务正常',offline:'无法连接本机服务','key-unavailable':'无法打开加密信息库',notification:'通知未获许可'}[serviceState]"></h3><p x-text="serviceState==='key-unavailable'?'系统密钥不可用，原数据库已保留。请恢复当前系统账户密钥，或在新的空库使用加密备份恢复。':serviceState==='notification'?'申请仍保存在收件箱。打开系统通知权限后可重新发送测试通知。':'断开期间不显示审批成功，草稿保留；重连后重新核对请求实际状态。'"></p><button class="secondary" @click="serviceState='connected'">重新检查连接</button><div class="flow-actions"><button class="text-button" @click="serviceState='notification'">查看通知权限</button><button class="text-button" @click="serviceState='key-unavailable'">查看密钥不可用状态</button></div></div></template>
  <template x-if="flow==='combined-result'"><div class="flow-facts"><p>两种许可分别生效，程序不会自动启动。</p><div><span>凭据使用</span><strong x-text="useDecision[requestId]?.use?'已批准 · 一次启动尝试':'未批准 · 不可调用 run-use'"></strong></div><div><span>普通字段</span><strong x-text="(useDecision[requestId]?.fields.length||0)+' 个 · 可重复读取'"></strong></div><div><span>各自到期</span><span x-text="useMinutes==='15'?'今天 14:55':'今天 15:10'"></span></div><p>启动尝试不会消费字段读取许可；单项撤销相互独立。「撤销本次申请」撤销两项剩余许可。</p><button class="secondary" @click="page='history';historyFilter='all';closeFlow()">查看两项授权记录 →</button></div></template>
  <template x-if="flow==='request-terminal'"><div><h3 x-text="currentRequest.state"></h3><p>该请求不能再批准。轮询原请求不会创建新申请。确有需要时重新发起并说明原因。</p><button class="secondary" @click="closeFlow()">返回收件箱</button></div></template>
  <p class="flow-error" role="alert" x-show="flowError" x-text="flowError"></p>
  <div x-show="flow==='result-missing'"><h3>当前信息已不存在</h3><p>提案处理事实仍保留，不能从旧副本恢复读取内容。请前往回收站检查。</p><button class="secondary" @click="openFlow('trash')">查看回收站</button></div>
  <div x-show="flow==='proposal-failure'"><h3>未应用这批变更</h3><p>调整内容仍保留，可以返回核对后重试。</p><button class="secondary" @click="injectFailure=false;closeFlow()">返回核对</button></div>
 </section>
</div>

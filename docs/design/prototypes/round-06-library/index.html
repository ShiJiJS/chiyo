<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信息库 · 分类与导航</title><link rel="stylesheet" href="../round-05/prototype.css"><link rel="stylesheet" href="library.css"><script defer src="library.js"></script><script defer src="../round-05/vendor/alpine.min.js"></script></head>
<body x-data="libraryWorkspace" :data-theme="theme" @keydown.escape.window="dismiss()">
<svg class="symbols"><defs><symbol id="folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v12H3z"/></symbol><symbol id="layers" viewBox="0 0 24 24"><path d="m12 3 9 6-9 6-9-6 9-6Z M3 14l9 6 9-6"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol></defs></svg>
<header class="topbar"><div class="brand"><svg><use href="#layers"/></svg>信息授权</div><nav aria-label="主导航"><button class="tab">访问审批</button><button class="tab active">信息库</button><button class="tab">录入提案</button><button class="tab">授权历史</button><button class="tab">设置</button></nav><div class="themes"><template x-for="v in ['purple','green','blue','mono']"><button :class="{chosen:theme===v}" @click="theme=v" x-text="({purple:'紫',green:'绿',blue:'蓝',mono:'黑白'})[v]"></button></template></div></header>
<main class="workspace">
 <aside class="rail"><div class="rail-head"><h1>信息库</h1><div class="mode"><button :class="{selected:mode==='info'}" @click="mode='info'">信息</button><button :class="{selected:mode==='credentials'}" @click="mode='credentials'">凭据</button></div></div>
 <div class="roots"><button class="nav-row" :class="{selected:directory===null}" @click="all()"><span>全部信息</span><small x-text="items.length"></small></button><button class="nav-row" :class="{selected:directory==='none'}" @click="choose('none')"><span>未分类</span><small x-text="items.filter(i=>!i.directory).length"></small></button></div>
 <div class="section-head"><span>目录</span><button aria-label="新建目录" @click="editDirectory(null,null)">＋</button></div>
 <div class="tree scroll"><template x-for="d in tree()" :key="d.id"><div class="tree-row" :class="{selected:directory===d.id}" :style="'padding-left:'+d.depth*14+'px'"><button class="expand" :aria-label="'展开或收起'+d.name" @click="toggle(d.id)" x-text="hasChildren(d.id)?(collapsed.includes(d.id)?'›':'⌄'):''"></button><button class="tree-label" @click="choose(d.id)"><svg><use href="#folder"/></svg><span x-text="d.name"></span><small x-text="count(d.id)"></small></button><button class="more" :aria-label="d.name+'的操作'" @click="openMenu(d,$event)">···</button></div></template><p class="muted empty-tree" x-show="!dirs.length">还没有目录</p></div>
 <footer class="rail-foot"><button @click="notice='回收站中的信息恢复时，已删除的目录将显示为未分类。'">回收站</button><small>信息保存在本机</small></footer></aside>
 <section class="results"><div class="list-head"><div class="heading-row"><h2 x-text="scopeName()"></h2><button class="outlined" @click="open('newInfo')">＋ 新建</button></div><small x-text="filtered().length+' 条信息'+(directory&&directory!=='none'&&descendants?' · 包含下级':'')"></small><label class="search"><svg><use href="#search"/></svg><input aria-label="搜索信息" :placeholder="'搜索'+scopeName()" x-model="query" @input="selected=null"></label><div class="tools"><button class="outlined" @click="tagSearch='';open('filter')">标签 <span x-show="tagIds.length" x-text="tagIds.length"></span>⌄</button><button class="outlined" @click="reverse=!reverse">名称 <span x-text="reverse?'↓':'↑'"></span></button><button class="link" x-show="directory" @click="directory=null;selected=null">在全部信息中搜索</button></div><label class="include" x-show="directory&&directory!=='none'"><input type="checkbox" x-model="descendants">包含下级目录</label><div class="chips"><template x-for="id in tagIds"><button @click="tagIds=tagIds.filter(t=>t!==id);selected=null" x-text="tagName(id)+' ×'"></button></template><button class="link" x-show="query||tagIds.length" @click="query='';tagIds=[];selected=null">清除筛选</button></div></div>
 <div class="item-list scroll"><template x-for="i in filtered()" :key="i.id"><button class="item" :class="{selected:current()?.id===i.id}" @click="selected=i.id"><strong x-text="i.name"></strong><small x-text="path(i.directory)"></small><span class="item-meta" x-text="i.fields.length+' 个字段'+(i.file?' · 含附件':'')"></span></button></template><div class="empty" x-show="!filtered().length"><h3>没有匹配的信息</h3><p>调整关键词、目录或标签后再试。</p><button class="outlined" @click="all()">查看全部信息</button></div></div></section>
 <section class="detail"><template x-if="current()"><article class="paper"><div class="paper-bar"><span x-text="path(current().directory)"></span><button class="outlined" @click="organize()">调整目录与标签</button></div><div class="paper-body scroll"><div class="document-kind">信息详情</div><h1 x-text="current().name"></h1><p class="description" x-text="current().description"></p><div class="chips"><template x-for="id in current().tags"><span x-text="tagName(id)"></span></template></div><h3>信息内容</h3><template x-for="f in current().fields"><div class="field"><span x-text="f.name"></span><code x-text="f.value"></code></div></template><div class="related"><h3>关联凭据</h3><p class="muted">北辰测试服务器 · SSH 私钥</p><small>使用凭据需要单独申请授权</small></div></div></article></template><div class="empty-detail" x-show="!current()">选择一条信息查看内容</div></section>
</main>
<div class="toast" x-show="notice" x-cloak role="status"><span x-text="notice"></span><button aria-label="关闭提示" @click="notice=''">×</button></div>
<div class="menu" x-show="menu" x-cloak :style="menuPosition" @click.outside="menu=null"><template x-for="a in ['新建子目录','重命名','移动','删除']"><button @click="directoryAction(a)" x-text="a"></button></template></div>
<div class="backdrop" x-show="surface" x-cloak @click.self="dismiss()"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h2 id="dialog-title" x-text="titles[surface]||surface"></h2><button aria-label="关闭" @click="dismiss()">×</button></header>
 <div class="dialog-body scroll">
 <template x-if="['create','rename','move'].includes(surface)"><div><label x-show="surface!=='move'">目录名称<input id="directory-name" x-model="draftName" placeholder="例如：运维"></label><p x-show="surface==='move'" class="description" x-text="'将“'+draftName+'”移到新位置'"></p><label>上级目录</label><input aria-label="搜索上级目录" placeholder="搜索目录" x-model="directorySearch"><div class="choice-tree"><button class="choice" :class="{selected:draftParent===null}" @click="draftParent=null">根目录 <span x-show="draftParent===null">✓</span></button><template x-for="d in tree(true).filter(d=>path(d.id).includes(directorySearch))"><button class="choice" :style="'padding-left:'+(12+d.depth*16)+'px'" :class="{selected:draftParent===d.id}" :disabled="blocked(d.id)" @click="draftParent=d.id"><svg><use href="#folder"/></svg><span x-text="d.name"></span><small x-show="blocked(d.id)">不可移入</small><span x-show="draftParent===d.id">✓</span></button></template></div></div></template>
 <template x-if="['tags','filter','organize'].includes(surface)"><div><template x-if="surface==='organize'"><div><label>所属目录</label><input aria-label="搜索归属目录" placeholder="搜索目录" x-model="directorySearch"><div class="choice-tree"><button class="choice" @click="draftParent=null" :class="{selected:draftParent===null}">未分类</button><template x-for="d in tree(true).filter(d=>path(d.id).includes(directorySearch))"><button class="choice" :style="'padding-left:'+(12+d.depth*14)+'px'" :class="{selected:draftParent===d.id}" @click="draftParent=d.id" x-text="d.name"></button></template></div><label>标签</label></div></template><div class="tag-toolbar"><input aria-label="搜索标签" placeholder="搜索标签" x-model="tagSearch"><button class="outlined" x-show="surface==='tags'" @click="editTag=null;tagNameDraft=''">新建标签</button></div><div class="inline-form" x-show="surface==='tags'&&editTag!==undefined"><input aria-label="标签名称" placeholder="标签名称" x-model="tagNameDraft"><button class="outlined" @click="saveTag()">保存</button><button @click="editTag=undefined">取消</button></div><div class="tag-choices"><template x-for="t in tags.filter(t=>t.name.includes(tagSearch))" :key="t.id"><div class="tag-row"><template x-if="surface!=='tags'"><label><input type="checkbox" :value="t.id" x-model="draftTags"><span x-text="t.name"></span></label></template><template x-if="surface==='tags'"><span x-text="t.name"></span></template><small x-text="items.filter(i=>i.tags.includes(t.id)).length+' 条'"></small><template x-if="surface==='tags'"><div class="actions"><button @click="editTag=t.id;tagNameDraft=t.name">重命名</button><button @click="pendingTag=t;surface='deleteTag'">删除</button></div></template></div></template></div></div></template>
 <template x-if="surface==='delete'"><div><p x-text="'删除目录“'+draftName+'”？'"></p><p class="description" x-text="count(editId)||hasChildren(editId)?'该目录包含信息或子目录，请先移动它们。':'这是空目录，删除后信息内容不会受到影响。'"></p></div></template>
 <template x-if="surface==='deleteTag'"><div><p x-text="'删除标签“'+pendingTag?.name+'”？'"></p><p class="description" x-text="'将移除 '+items.filter(i=>i.tags.includes(pendingTag?.id)).length+' 条信息上的标记，信息和附件会保留。'"></p></div></template>
 <template x-if="surface==='newInfo'"><p>在信息编辑器中选择已有目录与标签；分类管理完成后可返回继续编辑。</p></template>
 <p class="error" x-show="error" role="alert" x-text="error"></p>
 </div><footer><button class="link" x-show="surface==='filter'" @click="draftTags=[]">清除标签</button><button class="link" x-show="surface==='filter'" @click="surface='tags';editTag=undefined">管理标签</button><span class="spacer"></span><button class="outlined" @click="dismiss()" x-text="surface==='tags'?'完成':'取消'"></button><button class="primary" x-show="surface!=='tags'&&surface!=='newInfo'" :disabled="surface==='delete'&&(count(editId)>0||hasChildren(editId))" @click="submit()" x-text="surface==='filter'?'使用所选标签':surface.startsWith('delete')?'删除':surface==='create'?'创建':'保存'"></button></footer>
</section></div>
</body></html>

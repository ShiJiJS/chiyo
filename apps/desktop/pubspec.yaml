name: info_desktop
description: Local information authorization and managed credentials desktop.
publish_to: none
version: 0.4.4+19
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  info_workspace:
    path: ../../packages/info_workspace
  crypto: 3.0.7
  ffi: 2.2.0
  markdown: 7.3.1
  flutter:
    sdk: flutter
  info_core:
    path: ../../packages/info_core
  info_storage:
    path: ../../packages/info_storage
  info_remote:
    path: ../../packages/info_remote
  info_cli:
    path: ../../packages/info_cli
dev_dependencies:
  info_server:
    path: ../server
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: 3.7.1
flutter:
  uses-material-design: true
  assets:
    - assets/branding/chiyo-icon.png
    - assets/fonts/OFL.txt
    - assets/zhiyu_files/
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_128.png
  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
          weight: 400
    - family: AppSans
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.otf
          weight: 500
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

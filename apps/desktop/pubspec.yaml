name: info_desktop
description: Local information authorization desktop, fictional data slice.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  info_core:
    path: ../../packages/info_core
  info_storage:
    path: ../../packages/info_storage
dev_dependencies:
  info_cli:
    path: ../../packages/info_cli
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

name: info_server
description: Independent online information service host.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  info_workspace:
    path: ../../packages/info_workspace
  crypto: ^3.0.6
  info_core:
    path: ../../packages/info_core
  info_storage:
    path: ../../packages/info_storage
dev_dependencies:
  info_cli:
    path: ../../packages/info_cli
  info_remote:
    path: ../../packages/info_remote
  test: ^1.26.3
  lints: ^6.0.0
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
